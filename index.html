<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILMKHONA — Смотрите лучшее кино</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="loader">
    <div class="loader-logo">FILMKHONA</div>
    <div class="loader-bar"></div>
    <p class="loader-text" data-i18n="loading">Загрузка FILMKHONA...</p>
  </div>

  <div class="bg-gradient-3d" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-2" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-3" aria-hidden="true"></div>

  <header class="navbar" id="navbar">
    <a href="index.html" class="logo">FILMKHONA</a>
    <button class="nav-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html" class="active" data-i18n="navHome">Главная</a></li>
      <li><a href="library.html" data-i18n="navLibrary">Библиотека</a></li>
    </ul>
    <div class="nav-right">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ru" type="button">RU</button>
        <button class="lang-btn" data-lang="tj" type="button">TJ</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content">
      <span class="hero-badge" data-i18n="heroBadge">Премьера</span>
      <h1 id="hero-title">Тёмный город</h1>
      <p class="hero-desc" id="hero-desc">Детектив раскрывает заговор в мегаполисе будущего.</p>
      <div class="hero-buttons">
        <a href="watch.html?id=1" class="btn btn-primary" id="hero-play">▶ <span data-i18n="heroPlay">Смотреть</span></a>
        <a href="watch.html?id=1" class="btn btn-glass" id="hero-info"><span data-i18n="heroInfo">Подробнее</span></a>
      </div>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="section-header">
        <h2 data-i18n="sectionFeatured">Рекомендуем</h2>
        <div class="slider-controls">
          <button class="slider-btn slider-prev" type="button" aria-label="Previous">‹</button>
          <button class="slider-btn slider-next" type="button" aria-label="Next">›</button>
        </div>
      </div>
      <div class="slider-track" id="featured-slider"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2 data-i18n="sectionTrending">В тренде</h2>
      </div>
      <div class="trending-grid" id="trending-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 <span>FILMKHONA</span> — Premium Cinema Experience</p>
  </footer>

  <script src="script.js"></script>
  <script>
    window.addEventListener('scroll', function() {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
    });
  </script>
</body>
</html>
