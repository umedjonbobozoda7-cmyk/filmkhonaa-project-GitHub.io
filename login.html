<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — FILMKHONA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: var(--red);
    }

    .auth-card p {
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font);
      transition: border-color var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--red);
      background: rgba(255, 255, 255, 0.08);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .form-remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .form-remember input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font);
      margin-top: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--red-hover);
      transform: scale(1.01);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.85rem;
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      display: none;
      animation: slide-down 0.3s ease;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.3);
      color: #ff6b6b;
    }

    .alert-success {
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #66bb6a;
    }

    .alert-info {
      background: rgba(33, 150, 243, 0.15);
      border: 1px solid rgba(33, 150, 243, 0.3);
      color: #42a5f5;
    }

    .resend-verification {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--glass-border);
      text-align: center;
      font-size: 0.85rem;
    }

    .resend-verification p {
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .btn-resend {
      padding: 0.5rem 1rem;
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font);
    }

    .btn-resend:hover {
      background: rgba(229, 9, 20, 0.1);
    }

    .btn-resend:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--glass-border);
    }

    .auth-footer p {
      margin: 0;
      font-size: 0.85rem;
    }

    .auth-footer a {
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }

    .auth-footer a:hover {
      color: var(--red-hover);
    }

    @keyframes slide-down {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 1.75rem;
      }

      .auth-card h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body data-page="login">
  <div id="loader">
    <div class="loader-logo">FILMKHONA</div>
    <div class="loader-bar"></div>
    <p class="loader-text">Загрузка FILMKHONA...</p>
  </div>

  <div class="bg-gradient-3d" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-2" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-3" aria-hidden="true"></div>

  <header class="navbar" id="navbar">
    <a href="index.html" class="logo">FILMKHONA</a>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Вход</h1>
      <p>Войдите в ваш аккаунт</p>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="example@mail.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input
            type="password"
            id="password"
            placeholder="Ваш пароль"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="form-remember">
          <input
            type="checkbox"
            id="rememberMe"
            checked
          />
          <label for="rememberMe" style="margin: 0;">
            Запомнить меня
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Войти
        </button>
      </form>

      <div id="resendSection" class="resend-verification" style="display: none;">
        <p>Проверьте вашу почту для подтверждения</p>
        <button type="button" class="btn-resend" id="resendBtn">
          Отправить письмо повторно
        </button>
      </div>

      <div class="auth-footer">
        <p>
          Нет аккаунта?
          <a href="signup.html">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      loginUser,
      resendEmailVerification,
      onAuthChange
    } from './firebaseAuth.js';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const alertDiv = document.getElementById('alert');
    const resendSection = document.getElementById('resendSection');
    const resendBtn = document.getElementById('resendBtn');

    function showAlert(message, type = 'error') {
      alertDiv.textContent = message;
      alertDiv.className = `alert show alert-${type}`;
      alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideAlert() {
      alertDiv.classList.remove('show');
    }

    // Check for registration success message
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      showAlert('Регистрация успешна! Пожалуйста, подтвердите вашу почту.', 'success');
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (urlParams.get('emailVerificationSent') === 'true') {
      showAlert('Письмо подтверждения отправлено на вашу почту', 'info');
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      resendSection.style.display = 'none';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Все поля обязательны', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Вход...';

      const result = await loginUser(email, password);

      if (result.success) {
        showAlert(result.message, 'success');
        form.reset();

        // Redirect to home after 1 second
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        showAlert(result.error, 'error');

        // Show resend option if email not verified
        if (result.error.includes('подтвердите')) {
          resendSection.style.display = 'block';
        }

        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });

    // Resend verification email
    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      resendBtn.textContent = 'Отправка...';

      const result = await resendEmailVerification();

      if (result.success) {
        showAlert(result.message, 'success');
      } else {
        showAlert(result.error, 'error');
      }

      // Re-enable button after 3 seconds
      setTimeout(() => {
        resendBtn.disabled = false;
        resendBtn.textContent = 'Отправить письмо повторно';
      }, 3000);
    });

    // Hide loader
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        loader.classList.add('hidden');
      }, 1000);
    });
  </script>
</body>
</html>
